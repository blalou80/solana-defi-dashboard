[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-defi-analytics"
version = "0.1.0"
description = "Real-time DeFi analytics and risk management for Solana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "solana",
    "pandas",
    "numpy",
    "streamlit",
    "python-dotenv",
    "pyyaml",
    "pytest",
    "pytest-asyncio",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
package-dir = { "" = "src" }
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic ruleset for a codebase brought back from "never linted":
# correctness-first. Style-heavy pyupgrade typing rewrites (UP006/UP035/UP045)
# are deferred so this diff stays reviewable.
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = [
  "E501",    # line length handled by formatter, not blocker
  "B006",    # mutable defaults: dataclass field(default_factory) usage is fine
  "SIM108",  # ternary suggestions are noise
]

[tool.ruff.lint.per-file-ignores]
"src/xyops/*" = ["F401"]
"tests/*" = ["B017"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
