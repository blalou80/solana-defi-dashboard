# Single-host compose: daemon + dashboard sharing one SQLite volume.
# NOT for serverless platforms — SQLite requires the mounted disk.
services:
  daemon:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
      - defi-data:/app/.data
    command: >
      sh -c "pip install -q -r requirements.lock.txt -e . && defi-daemon"
    restart: unless-stopped
  dashboard:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
      - defi-data:/app/.data
    ports:
      - "127.0.0.1:8501:8501"
    command: >
      sh -c "pip install -q -r requirements.lock.txt -e . &&
             python -m streamlit run src/dashboard/app.py
             --server.headless true --server.address 0.0.0.0"
    depends_on: [daemon]
    restart: unless-stopped
volumes:
  defi-data:
