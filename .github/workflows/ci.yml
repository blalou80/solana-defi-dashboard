name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: ruff check src tests
      - run: python -m pytest tests/ -q -m "not live"
        # Deterministic gate: offline suite only (import smoke, unit,
        # fixture-backed, SQLite). Live network tests never gate merges.
      - run: python -m pytest tests/ -q -m live
        continue-on-error: true
        # Informational: real Jupiter/Orca/RPC calls. Public endpoints
        # rate-limit, so failures here are investigated, not blocking.
